name: "ToneCustoms | Partnership Inquiry"
description: "Propose a FiveM, creator, developer, or community collaboration (public summary only)"
title: "[ToneCustoms Partnership] "
labels: ["partnership"]
body:
  - type: markdown
    attributes:
      value: |
        ## TONECUSTOMS / PARTNERSHIPS
        This GitHub issue is PUBLIC. Submit only a non-confidential proposal. Do not include personal contact details, financial terms, private links, contracts, keys, or private source code. Sensitive discussions can move to a private channel after initial review. Submissions do not guarantee approval.
  - type: dropdown
    id: type
    attributes:
      label: "01 / Partnership type"
      options:
        - FiveM server collaboration
        - Content creator / showcase
        - Developer / integration
        - Community event / cross-promotion
        - Other business collaboration
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: "02 / Community, creator, or organization name"
      description: "Public-facing name only; no personal contact details."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: "03 / About your project"
      description: "Describe what you do and who you serve. Public links only."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "04 / Proposed collaboration"
      description: "What would the partnership involve? Keep terms and private details out of this public issue."
    validations:
      required: true
  - type: textarea
    id: mutual
    attributes:
      label: "05 / Mutual benefit"
      description: "What would each side contribute and gain?"
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: "06 / Preferred timeline"
      options:
        - Flexible
        - Within 30 days
        - Within 1–3 months
        - Later / exploratory
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Partnership rules
        Review the [ToneCustoms Partnership Rules & Regulations](https://tonecustoms.github.io/tonecustoms-docs/PARTNERSHIPS#partnership-rules-and-regulations) before submitting. Public proposals are not contracts.
  - type: checkboxes
    id: consent
    attributes:
      label: "Before submitting"
      options:
        - label: "I understand this proposal is public and contains no confidential or personal information."
          required: true
        - label: "I understand submitting a proposal does not establish a partnership or guarantee acceptance."
          required: true
        - label: "I have reviewed the ToneCustoms partnership rules and understand script redistribution and brand use require authorization."
          required: true
