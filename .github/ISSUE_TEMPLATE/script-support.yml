name: "Script Support"
description: "Get help with a ToneCustoms FiveM resource (public report)"
title: "[Support] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        This issue will be PUBLIC. Do not post license keys, order details, credentials, private source code, or personal information. GitHub sign-in is required.
  - type: dropdown
    id: script
    attributes:
      label: ToneCustoms script
      options:
        - Gun Jam
        - Family System
        - Window Cleaning
        - Queue
        - Farming
        - Skills
        - 3D Roleplay Text
        - Multi Job
        - Pharmacy
        - Other
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Qbox
        - QBCore
        - ESX
        - Other / Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Script version (if known)
      placeholder: "e.g. 1.0.0"
  - type: input
    id: inventory
    attributes:
      label: Inventory and relevant dependencies (if applicable)
      placeholder: "e.g. ox_inventory, ox_lib, ox_target"
  - type: textarea
    id: issue
    attributes:
      label: What is happening?
      description: Describe what happened and what you expected.
      placeholder: "Describe the issue and how to reproduce it."
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Relevant errors (redacted)
      description: Remove credentials, identifiers, license keys, and private data before posting.
      render: text
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: List troubleshooting steps and results.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      options:
        - label: I understand this report is public and contains no private information.
          required: true
