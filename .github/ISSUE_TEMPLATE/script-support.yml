name: "🛠️ ToneCustoms | Script Support"
description: "Installation help, resource errors, inventory integration, or gameplay problems"
title: "[ToneCustoms Support] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        ## TONECUSTOMS / TECHNICAL SUPPORT
        **Built for Roleplay. Made with Purpose.**

        Thanks for contacting ToneCustoms. Please complete the details below so we can understand your issue without repeating basic questions.

        Review the [ToneCustoms Rules & Regulations](https://tonecustoms.github.io/tonecustoms-docs/RULES_AND_REGULATIONS) and [support hours](https://tonecustoms.github.io/tonecustoms-docs/SUPPORT#support-hours-and-response-times).\n\n        **PUBLIC REPORT:** Anyone can view this GitHub issue. Never share purchase information, license keys, passwords, tokens, private source code, server identifiers, or personal details. For billing and order verification, use your original private Tebex support thread.
  - type: dropdown
    id: product
    attributes:
      label: "01 / ToneCustoms resource"
      description: "Which resource needs support?"
      options:
        - Gun Jam
        - Family System
        - Window Cleaning
        - Queue
        - Farming
        - Skills
        - 3D Roleplay Text
        - Multi Job
        - Pharmacy
        - Other ToneCustoms resource
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: "02 / Framework"
      options:
        - Qbox / QBX
        - QBCore
        - ESX Legacy
        - Standalone
        - Other / Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "03 / Resource version"
      placeholder: "Version number if known"
  - type: input
    id: dependencies
    attributes:
      label: "04 / Relevant dependencies"
      description: "For example, ox_inventory, ox_lib, ox_target, oxmysql."
      placeholder: "Dependencies and inventory system"
  - type: dropdown
    id: category
    attributes:
      label: "05 / Problem category"
      options:
        - Resource does not start
        - Script error in console
        - Interaction / keybind not working
        - Inventory item issue
        - UI / menu issue
        - Database / saving issue
        - Unexpected gameplay behavior
        - Installation / configuration question
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "06 / What happened?"
      description: "Explain the problem clearly."
      placeholder: "Describe what you see and when the problem occurs."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "07 / What should happen?"
      placeholder: "Describe the expected result."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "08 / Steps to reproduce"
      placeholder: |
        1. Start the resource...
        2. Use the interaction...
        3. Observe the issue...
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: "09 / Console errors or screenshots"
      description: "Paste redacted errors or attach screenshots. Remove all sensitive data."
      placeholder: "Paste the first relevant redacted error, if available."
  - type: textarea
    id: tried
    attributes:
      label: "10 / Troubleshooting already attempted"
      placeholder: "What have you checked, changed, or tried?"
  - type: checkboxes
    id: confirm
    attributes:
      label: "Before submitting"
      options:
        - label: "I understand this is a public GitHub issue and have removed all private information."
          required: true
        - label: "I have checked the available ToneCustoms documentation and troubleshooting guides."
          required: true
        - label: "I have reviewed the ToneCustoms Rules & Regulations and will keep this request respectful and on-topic."
          required: true
