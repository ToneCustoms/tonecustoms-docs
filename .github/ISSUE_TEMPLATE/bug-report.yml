name: "📖 ToneCustoms | Documentation Issue"
description: "Broken links, missing details, or incorrect documentation"
title: "[ToneCustoms Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ## TONECUSTOMS / DOCUMENTATION FEEDBACK
        Help us keep the official ToneCustoms guides accurate and easy to follow. Reports are public.
  - type: input
    id: page
    attributes:
      label: "01 / Documentation page"
      placeholder: "Paste the page URL or title"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: "02 / Issue type"
      options:
        - Broken link
        - Incorrect instruction
        - Missing installation step
        - Outdated information
        - Formatting / readability
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: "03 / What needs fixing?"
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: "04 / Suggested correction (optional)"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "This public report contains no credentials, license keys, or private information."
          required: true
