name: "✦ ToneCustoms | Feature Suggestion"
description: "Suggest a useful improvement to a resource, website, or guide"
title: "[ToneCustoms Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## TONECUSTOMS / IDEAS & IMPROVEMENTS
        **Built for Roleplay. Made with Purpose.**

        We welcome thoughtful ideas that improve roleplay, usability, and documentation. Suggestions are reviewed individually and do not guarantee implementation.
  - type: dropdown
    id: area
    attributes:
      label: "01 / Where should we improve?"
      options:
        - FiveM script
        - Documentation
        - ToneCustoms website
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: "02 / Related resource (if applicable)"
      placeholder: "Name of the ToneCustoms script"
  - type: textarea
    id: idea
    attributes:
      label: "03 / Describe your idea"
      placeholder: "What would you like to see?"
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: "04 / How would this improve the experience?"
      placeholder: "Explain the roleplay or usability benefit."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "This public suggestion contains no private information or protected source code."
          required: true
