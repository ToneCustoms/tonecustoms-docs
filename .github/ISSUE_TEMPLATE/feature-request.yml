name: "Feature Request"
description: "Suggest an improvement to ToneCustoms scripts or documentation"
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ToneCustoms script
        - Documentation
        - Website
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like improved?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: How would this help?
