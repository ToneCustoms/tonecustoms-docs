name: ToneCustoms Support Triage

on:
  issues:
    types: [opened, reopened, closed, assigned]

permissions:
  issues: write

jobs:
  welcome-and-organize:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Organize incoming ToneCustoms support requests
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const title = issue.title || '';
            const repo = context.repo;
            let category = 'support';
            let labelColor = '8e44ad';
            let description = 'ToneCustoms customer support';
            let message = [
              'Thanks for reaching out to **ToneCustoms Support**.',
              '',
              'Your request has been received through GitHub Issues. A ToneCustoms team member can review and reply here.',
              '',
              '**While you wait:**',
              '- Check the [ToneCustoms troubleshooting guides](https://tonecustoms.github.io/tonecustoms-docs/TROUBLESHOOTING).',
              '- Keep relevant console errors and reproduction steps available.',
              '- Do not post license keys, credentials, payment details, order information, or private source files in this public issue.',
              '',
              'Please follow this issue for replies and updates.',
              '',
              '*Built for Roleplay. Made with Purpose.*'
            ].join('\n');
            if (title.startsWith('[ToneCustoms Docs]') || title.startsWith('[Docs Bug]')) {
              category = 'documentation';
              labelColor = '277da1';
              description = 'Documentation fixes and corrections';
              message = [
                'Thanks for helping improve **ToneCustoms Documentation**.',
                '',
                'Your report is logged here. Please include the page URL and the exact instruction or link that needs correction.',
                '',
                'A team member can follow up in this issue. Avoid posting any private information.',
                '',
                '*Built for Roleplay. Made with Purpose.*'
              ].join('\n');
            } else if (title.startsWith('[ToneCustoms Idea]') || title.startsWith('[Suggestion]')) {
              category = 'enhancement';
              labelColor = 'a371f7';
              description = 'Suggestions and improvements';
              message = [
                'Thanks for sharing an idea with **ToneCustoms**.',
                '',
                'Your suggestion is now recorded. Feature ideas are reviewed individually and do not guarantee a release or implementation date.',
                '',
                '*Built for Roleplay. Made with Purpose.*'
              ].join('\n');
            }
            else if (title.startsWith('[ToneCustoms Partnership]')) {
              category = 'partnership';
              labelColor = '8250df';
              description = 'ToneCustoms partnership and collaboration inquiries';
              message = [
                'Thanks for your interest in partnering with **ToneCustoms**.',
                '',
                'Your non-confidential proposal has been received for review. Submission does not guarantee approval, sponsorship, free scripts, or an agreement.',
                '',
                'Do not post financial terms, contracts, personal contact details, or other confidential information in this public issue.',
                '',
                '[Partnership information](https://tonecustoms.github.io/tonecustoms-docs/PARTNERSHIPS)',
                '',
                '*Built for Roleplay. Made with Purpose.*'
              ].join('\n');
            }
            const managementLabels = [
              { name: 'priority: high', color: 'b91c1c', description: 'Urgent customer-impacting issue requiring review' },
              { name: 'priority: normal', color: '64748b', description: 'Standard support priority' },
              { name: 'priority: low', color: '0e7490', description: 'Non-urgent support or documentation request' }
            ];
            for (const label of managementLabels) {
              try {
                await github.rest.issues.getLabel({ ...repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, ...label });
              }
            }
            const statusLabels = [
              { name: 'status: new', color: '7c3aed', description: 'New support request awaiting review' },
              { name: 'status: investigating', color: '2563eb', description: 'ToneCustoms is reviewing the issue' },
              { name: 'status: waiting-on-customer', color: 'd97706', description: 'More information is needed from the customer' },
              { name: 'status: resolved', color: '15803d', description: 'Issue resolved or fix documented' }
            ];
            for (const label of statusLabels) {
              try {
                await github.rest.issues.getLabel({ ...repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, ...label });
              }
            }
            try {
              await github.rest.issues.getLabel({ ...repo, name: category });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  ...repo, name: category, color: labelColor, description
                });
              } else {
                throw error;
              }
            }
            if (action === 'assigned') {
              const labels = (issue.labels || []).map(label => typeof label === 'string' ? label : label.name);
              if (labels.includes('status: new')) {
                await github.rest.issues.removeLabel({ ...repo, issue_number: issue.number, name: 'status: new' });
                await github.rest.issues.addLabels({ ...repo, issue_number: issue.number, labels: ['status: investigating'] });
              }
              return;
            }
            const oldStatus = (issue.labels || [])
              .map(label => typeof label === 'string' ? label : label.name)
              .filter(name => name && name.startsWith('status: '));
            const nextStatus = action === 'closed' ? 'status: resolved' : 'status: new';
            for (const label of oldStatus) {
              if (label === nextStatus) continue;
              await github.rest.issues.removeLabel({
                ...repo, issue_number: issue.number, name: label
              });
            }
            if (action === 'closed') {
              await github.rest.issues.addLabels({
                ...repo, issue_number: issue.number, labels: [nextStatus]
              });
              return;
            }
            await github.rest.issues.addLabels({
              ...repo, issue_number: issue.number, labels: [category, nextStatus]
            });
            if (action === 'opened') {
              const existingPriority = (issue.labels || []).some(label => {
                const name = typeof label === 'string' ? label : label.name;
                return name.startsWith('priority: ');
              });
              if (!existingPriority) {
                await github.rest.issues.addLabels({
                  ...repo, issue_number: issue.number, labels: ['priority: normal']
                });
              }
            }
            if (action === 'opened') {
              await github.rest.issues.createComment({
                ...repo, issue_number: issue.number, body: message
              });
            }
