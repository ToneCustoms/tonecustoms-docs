name: Deploy ToneCustoms Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.vitepress/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tonecustoms-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build public website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate local documentation links
        run: python3 tools/check_docs.py
      - name: Reject sensitive or restricted files
        run: python3 tools/check_public_safety.py
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build documentation
        run: npm run docs:build
      - name: Verify generated VitePress pages
        run: python3 tools/check_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload built website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

  deploy:
    name: Publish verified documentation
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
