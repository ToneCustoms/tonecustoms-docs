name: Documentation Quality

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.vitepress/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.vitepress/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-documentation:
    name: Check public documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate documentation links
        run: python3 tools/check_docs.py
      - name: Check for sensitive or restricted content
        run: python3 tools/check_public_safety.py
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build VitePress
        run: npm run docs:build
      - name: Verify generated pages
        run: python3 tools/check_site.py
