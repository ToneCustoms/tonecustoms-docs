name: Documentation Links

on:
  push:
    paths:
      - "**/*.md"
      - "tools/check_docs.py"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check_docs.py"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check relative documentation links
        run: python3 tools/check_docs.py
